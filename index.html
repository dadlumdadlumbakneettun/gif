<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gelişmiş GIF Düzenleyici</title>
    <script src="https://cdn.jsdelivr.net/npm/omggif@1.0.10/omggif.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/upng-js@2.1.0/UPNG.min.js"></script>
    <style>
        :root {
            --bg-color: #09090b;
            --panel-bg: #18181b;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-color: #f4f4f5;
            --border-color: #27272a;
            --error-color: #ef4444;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 320px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            user-select: none;
            background: #000000;
        }

        h2 {
            margin: 0 0 10px 0;
            font-size: 1rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .section {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
            font-size: 0.8rem;
            color: #a1a1aa;
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 8px;
            background: #09090b;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: #fff;
            box-sizing: border-box;
            margin-bottom: 8px;
        }

        .checkbox-label {
            cursor: pointer;
            color: #fff;
            font-weight: 500;
            user-select: none;
        }

        .checkbox-label input {
            width: auto;
            margin: 0;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .row > div {
            flex: 1;
        }

        button, .file-upload-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
            transition: background 0.2s;
            display: block;
        }

        button:hover, .file-upload-btn:hover {
            background-color: var(--accent-hover);
        }

        input[type="file"] {
            display: none;
        }

        #editor-container {
            position: relative;
            display: inline-block;
            max-width: 90vw;
            max-height: 80vh;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            background: #111;
        }

        #drop-instructions {
            padding: 60px 40px;
            text-align: center;
            color: #71717a;
        }

        canvas {
            display: block;
            cursor: crosshair;
        }

        #status-bar {
            position: absolute;
            bottom: 20px;
            background: rgba(0,0,0,0.9);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: none;
            z-index: 10;
        }

        #status-bar.error {
            border-color: var(--error-color);
            color: #fca5a5;
        }

        .info-badge {
            font-size: 0.75rem;
            color: #a1a1aa;
            margin-top: -4px;
            margin-bottom: 8px;
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>GIF Düzenleyici</h2>
        
        <div class="section">
            <label for="file-input" class="file-upload-btn">GIF Seç</label>
            <input type="file" id="file-input" accept="image/gif">
        </div>

        <div class="section">
            <h2>Çerçeve Ayarları</h2>
            <label class="checkbox-label">
                <input type="checkbox" id="lock-ratio-check" checked>
                Oranı Sabitle (Çıktı Oranı)
            </label>
            <p class="info-badge">Çerçeveyi boyutlandırırken en/boy oranını korur.</p>
            <button id="fit-1200-btn" style="background: #10b981; margin-bottom: 10px;">Çerçeveyi Sıfırla (1200x134 Oranı)</button>
            <div class="row">
                <div>
                    <label>Çerçeve W</label>
                    <input type="number" id="crop-w">
                </div>
                <div>
                    <label>Çerçeve H</label>
                    <input type="number" id="crop-h">
                </div>
            </div>
        </div>

        <div class="section">
            <h2>GIF Görsel Ayarları</h2>
            <p class="info-badge">Ekranda fare ile GIF'i tutup sürükleyebilirsiniz.</p>
            <div class="row">
                <div>
                    <label>GIF Genişlik</label>
                    <input type="number" id="gif-w">
                </div>
                <div>
                    <label>GIF Yükseklik</label>
                    <input type="number" id="gif-h">
                </div>
            </div>
            <button id="center-gif-btn" style="background: #3b82f6;">GIF'i Çerçeveye Ortala</button>
        </div>

        <div class="section">
            <h2>Nihai Çıktı Boyutu</h2>
            <div class="row">
                <div>
                    <label>Genişlik (px)</label>
                    <input type="number" id="width-input" value="1200">
                </div>
                <div>
                    <label>Yükseklik (px)</label>
                    <input type="number" id="height-input" value="134">
                </div>
            </div>
        </div>

        <div class="section">
            <h2>Boyut Düşürme / Optimazyon</h2>
            <label>Kare Atlama (Boyut Küçültme)</label>
            <select id="frame-step">
                <option value="1">Her Kareyi Al (Orijinal FPS / En Büyük Boyut)</option>
                <option value="2" selected>2 Karede 1 Al (Boyutu %50 Düşürür)</option>
                <option value="3">3 Karede 1 Al (Boyutu %66 Düşürür)</option>
            </select>
            <label>Sıkıştırma Kalitesi (GIF)</label>
            <select id="gif-quality">
                <option value="10">Standart Kalite (Hızlı)</option>
                <option value="20" selected>Yüksek Sıkıştırma (Düşük Boyut)</option>
                <option value="30">Maksimum Sıkıştırma</option>
            </select>
        </div>

        <div class="section">
            <h2>Yazı Ekle</h2>
            <label>Metin</label>
            <input type="text" id="text-input" placeholder="Yazı yazın...">
            <div class="row">
                <div>
                    <label>Boyut (px)</label>
                    <input type="number" id="text-size" value="28">
                </div>
                <div>
                    <label>Renk</label>
                    <input type="text" id="text-color" value="#ffffff">
                </div>
            </div>
            <div class="row">
                <div>
                    <label>Metin X</label>
                    <input type="number" id="text-x" value="20">
                </div>
                <div>
                    <label>Metin Y</label>
                    <input type="number" id="text-y" value="50">
                </div>
            </div>
        </div>

        <div class="section">
            <h2>Dışa Aktar</h2>
            <label>Format</label>
            <select id="export-format">
                <option value="gif">GIF</option>
                <option value="apng">APNG (Hareketli PNG)</option>
            </select>
            <button id="export-btn">İşle ve İndir</button>
        </div>
    </div>

    <div class="main-content">
        <div id="editor-container">
            <div id="drop-instructions">
                <p style="font-size: 1.2rem; margin-bottom: 5px;">GIF dosyasını buraya sürükleyin</p>
                <p style="font-size: 0.85rem;">veya sol panelden dosya seçin</p>
            </div>
            <canvas id="preview-canvas" style="display:none;"></canvas>
        </div>
        <div id="status-bar"></div>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const editorContainer = document.getElementById('editor-container');
        const dropInstructions = document.getElementById('drop-instructions');
        const previewCanvas = document.getElementById('preview-canvas');
        const ctx = previewCanvas.getContext('2d');
        const statusBar = document.getElementById('status-bar');

        let parsedFrames = [];
        let originalWidth = 0;
        let originalHeight = 0;
        let animationFrameId = null;
        let currentFrameIndex = 0;
        let workerBlobUrl = null;

        let cropData = { x: 0, y: 0, w: 1200, h: 134 };
        let gifData = { x: 0, y: 0, w: 0, h: 0 };
        let viewBounds = { minX: 0, minY: 0, viewW: 0, viewH: 0 };

        let isInteracting = false;
        let dragMode = null;
        let activeHandle = null;
        let dragStartX = 0, dragStartY = 0;
        let startCrop = {}, startGif = {};

        async function initWorker() {
            try {
                const res = await fetch('https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js');
                const text = await res.text();
                workerBlobUrl = URL.createObjectURL(new Blob([text], { type: 'application/javascript' }));
            } catch (err) {}
        }
        initWorker();

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => {
            editorContainer.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); });
            document.body.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); });
        });

        editorContainer.addEventListener('drop', e => {
            if (e.dataTransfer.files.length > 0) processGifFile(e.dataTransfer.files[0]);
        });

        fileInput.addEventListener('change', e => {
            if (e.target.files.length > 0) processGifFile(e.target.files[0]);
        });

        function processGifFile(file) {
            showStatus('GIF çözümleniyor...', false);
            const reader = new FileReader();

            reader.onload = function (e) {
                try {
                    const uint8Array = new Uint8Array(e.target.result);
                    const GifReaderClass = window.GifReader || (window.omggif && window.omggif.GifReader);
                    const gifReader = new GifReaderClass(uint8Array);

                    originalWidth = gifReader.width;
                    originalHeight = gifReader.height;

                    parsedFrames = [];
                    const numFrames = gifReader.numFrames();

                    const canvas = document.createElement('canvas');
                    canvas.width = originalWidth;
                    canvas.height = originalHeight;
                    const canvasCtx = canvas.getContext('2d');

                    for (let i = 0; i < numFrames; i++) {
                        const frameInfo = gifReader.frameInfo(i);
                        const imageData = canvasCtx.createImageData(originalWidth, originalHeight);

                        gifReader.decodeAndBlitFrameRGBA(i, imageData.data);

                        const frameCanvas = document.createElement('canvas');
                        frameCanvas.width = originalWidth;
                        frameCanvas.height = originalHeight;
                        const frameCtx = frameCanvas.getContext('2d');

                        if (i > 0 && frameInfo.disposal !== 2 && frameInfo.disposal !== 3) {
                            frameCtx.drawImage(parsedFrames[i - 1].canvas, 0, 0);
                        }

                        const tempCanvas = document.createElement('canvas');
                        tempCanvas.width = originalWidth;
                        tempCanvas.height = originalHeight;
                        tempCanvas.getContext('2d').putImageData(imageData, 0, 0);

                        frameCtx.drawImage(tempCanvas, 0, 0);

                        parsedFrames.push({
                            canvas: frameCanvas,
                            delay: (frameInfo.delay || 10) * 10
                        });
                    }

                    gifData = { x: 0, y: 0, w: originalWidth, h: originalHeight };
                    
                    dropInstructions.style.display = 'none';
                    previewCanvas.style.display = 'block';

                    autoFit1200x134();
                    hideStatus();
                    startPreview();

                } catch (err) {
                    showStatus('Hata: ' + err.message, true);
                }
            };

            reader.readAsArrayBuffer(file);
        }

        function getTargetRatio() {
            const tw = parseInt(document.getElementById('width-input').value) || 1200;
            const th = parseInt(document.getElementById('height-input').value) || 134;
            return tw / th;
        }

        function autoFit1200x134() {
            const ratio = getTargetRatio();
            const cropH = originalHeight;
            const cropW = cropH * ratio;
            const cropX = - (cropW - originalWidth) / 2;
            const cropY = 0;

            cropData = { x: cropX, y: cropY, w: cropW, h: cropH };
            gifData = { x: 0, y: 0, w: originalWidth, h: originalHeight };

            updateInputs();
        }

        function calculateViewBounds() {
            const padding = 40;
            const minX = Math.min(gifData.x, cropData.x) - padding;
            const minY = Math.min(gifData.y, cropData.y) - padding;
            const maxX = Math.max(gifData.x + gifData.w, cropData.x + cropData.w) + padding;
            const maxY = Math.max(gifData.y + gifData.h, cropData.y + cropData.h) + padding;

            viewBounds = {
                minX: minX,
                minY: minY,
                viewW: maxX - minX,
                viewH: maxY - minY
            };
        }

        function startPreview() {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            let lastTime = performance.now();
            currentFrameIndex = 0;

            function render(now) {
                if (parsedFrames.length === 0) return;

                const currentFrame = parsedFrames[currentFrameIndex];
                const delay = currentFrame.delay > 0 ? currentFrame.delay : 100;

                if (now - lastTime >= delay) {
                    currentFrameIndex = (currentFrameIndex + 1) % parsedFrames.length;
                    lastTime = now;
                }

                calculateViewBounds();

                previewCanvas.width = viewBounds.viewW;
                previewCanvas.height = viewBounds.viewH;

                ctx.fillStyle = '#111113';
                ctx.fillRect(0, 0, viewBounds.viewW, viewBounds.viewH);

                const cX = cropData.x - viewBounds.minX;
                const cY = cropData.y - viewBounds.minY;
                const gX = gifData.x - viewBounds.minX;
                const gY = gifData.y - viewBounds.minY;

                ctx.fillStyle = '#000000';
                ctx.fillRect(cX, cY, cropData.w, cropData.h);

                ctx.save();
                ctx.beginPath();
                ctx.rect(cX, cY, cropData.w, cropData.h);
                ctx.clip();

                ctx.drawImage(currentFrame.canvas, gX, gY, gifData.w, gifData.h);

                const text = document.getElementById('text-input').value;
                if (text) {
                    const textSize = document.getElementById('text-size').value;
                    const textColor = document.getElementById('text-color').value;
                    const textX = parseInt(document.getElementById('text-x').value) || 0;
                    const textY = parseInt(document.getElementById('text-y').value) || 0;

                    ctx.font = `${textSize}px Arial`;
                    ctx.fillStyle = textColor;
                    ctx.fillText(text, cX + textX, cY + textY);
                }
                ctx.restore();

                drawUIOverlay(cX, cY, gX, gY);

                animationFrameId = requestAnimationFrame(render);
            }

            animationFrameId = requestAnimationFrame(render);
        }

        function drawUIOverlay(cX, cY, gX, gY) {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.setLineDash([4, 4]);
            ctx.strokeRect(gX, gY, gifData.w, gifData.h);

            ctx.strokeStyle = '#6366f1';
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 6]);
            ctx.strokeRect(cX, cY, cropData.w, cropData.h);
            ctx.setLineDash([]);

            const handles = getHandlePositions(cX, cY, cropData.w, cropData.h);
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#6366f1';
            ctx.lineWidth = 1.5;

            handles.forEach(h => {
                ctx.beginPath();
                ctx.arc(h.x, h.y, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            });
        }

        function getHandlePositions(x, y, w, h) {
            return [
                { id: 'tl', x: x, y: y },
                { id: 'tr', x: x + w, y: y },
                { id: 'bl', x: x, y: y + h },
                { id: 'br', x: x + w, y: y + h }
            ];
        }

        function getCanvasMousePos(e) {
            const rect = previewCanvas.getBoundingClientRect();
            const scaleX = previewCanvas.width / rect.width;
            const scaleY = previewCanvas.height / rect.height;

            const clientX = e.clientX - rect.left;
            const clientY = e.clientY - rect.top;

            return {
                x: (clientX * scaleX) + viewBounds.minX,
                y: (clientY * scaleY) + viewBounds.minY
            };
        }

        previewCanvas.addEventListener('mousedown', e => {
            const pos = getCanvasMousePos(e);
            dragStartX = pos.x;
            dragStartY = pos.y;
            startCrop = { ...cropData };
            startGif = { ...gifData };

            const cX = cropData.x - viewBounds.minX;
            const cY = cropData.y - viewBounds.minY;
            const handles = getHandlePositions(cX, cY, cropData.w, cropData.h);

            for (let h of handles) {
                const dist = Math.hypot(pos.x - viewBounds.minX - h.x, pos.y - viewBounds.minY - h.y);
                if (dist <= 10) {
                    isInteracting = true;
                    dragMode = 'resize-handle';
                    activeHandle = h.id;
                    return;
                }
            }

            if (pos.x >= gifData.x && pos.x <= gifData.x + gifData.w &&
                pos.y >= gifData.y && pos.y <= gifData.y + gifData.h) {
                isInteracting = true;
                dragMode = 'move-gif';
                return;
            }

            if (pos.x >= cropData.x && pos.x <= cropData.x + cropData.w &&
                pos.y >= cropData.y && pos.y <= cropData.y + cropData.h) {
                isInteracting = true;
                dragMode = 'move-frame';
                return;
            }
        });

        window.addEventListener('mousemove', e => {
            if (!isInteracting) return;
            const pos = getCanvasMousePos(e);
            const dx = pos.x - dragStartX;
            const dy = pos.y - dragStartY;

            if (dragMode === 'move-gif') {
                gifData.x = startGif.x + dx;
                gifData.y = startGif.y + dy;
            } else if (dragMode === 'move-frame') {
                cropData.x = startCrop.x + dx;
                cropData.y = startCrop.y + dy;
            } else if (dragMode === 'resize-handle') {
                const lockRatio = document.getElementById('lock-ratio-check').checked;
                const ratio = getTargetRatio();

                let newW = startCrop.w;
                let newH = startCrop.h;
                let newX = startCrop.x;
                let newY = startCrop.y;

                if (activeHandle === 'br') {
                    newW = Math.max(30, startCrop.w + dx);
                    newH = lockRatio ? newW / ratio : Math.max(30, startCrop.h + dy);
                } else if (activeHandle === 'bl') {
                    newW = Math.max(30, startCrop.w - dx);
                    newX = startCrop.x + (startCrop.w - newW);
                    newH = lockRatio ? newW / ratio : Math.max(30, startCrop.h + dy);
                } else if (activeHandle === 'tr') {
                    newW = Math.max(30, startCrop.w + dx);
                    newH = lockRatio ? newW / ratio : Math.max(30, startCrop.h - dy);
                    if (lockRatio) newY = startCrop.y + (startCrop.h - newH);
                } else if (activeHandle === 'tl') {
                    newW = Math.max(30, startCrop.w - dx);
                    newX = startCrop.x + (startCrop.w - newW);
                    newH = lockRatio ? newW / ratio : Math.max(30, startCrop.h - dy);
                    if (lockRatio) newY = startCrop.y + (startCrop.h - newH);
                }

                cropData.w = newW;
                cropData.h = newH;
                cropData.x = newX;
                cropData.y = newY;
            }

            updateInputs();
        });

        window.addEventListener('mouseup', () => {
            isInteracting = false;
            dragMode = null;
            activeHandle = null;
        });

        function updateInputs() {
            document.getElementById('crop-w').value = Math.round(cropData.w);
            document.getElementById('crop-h').value = Math.round(cropData.h);
            document.getElementById('gif-w').value = Math.round(gifData.w);
            document.getElementById('gif-h').value = Math.round(gifData.h);
        }

        document.getElementById('crop-w').addEventListener('input', e => {
            cropData.w = parseFloat(e.target.value) || 10;
            if (document.getElementById('lock-ratio-check').checked) {
                cropData.h = cropData.w / getTargetRatio();
                document.getElementById('crop-h').value = Math.round(cropData.h);
            }
        });

        document.getElementById('crop-h').addEventListener('input', e => {
            cropData.h = parseFloat(e.target.value) || 10;
            if (document.getElementById('lock-ratio-check').checked) {
                cropData.w = cropData.h * getTargetRatio();
                document.getElementById('crop-w').value = Math.round(cropData.w);
            }
        });

        document.getElementById('gif-w').addEventListener('input', e => {
            const oldW = gifData.w;
            gifData.w = parseFloat(e.target.value) || 10;
            gifData.h = gifData.h * (gifData.w / oldW);
            document.getElementById('gif-h').value = Math.round(gifData.h);
        });

        document.getElementById('gif-h').addEventListener('input', e => {
            const oldH = gifData.h;
            gifData.h = parseFloat(e.target.value) || 10;
            gifData.w = gifData.w * (gifData.h / oldH);
            document.getElementById('gif-w').value = Math.round(gifData.w);
        });

        document.getElementById('center-gif-btn').addEventListener('click', () => {
            gifData.x = cropData.x + (cropData.w - gifData.w) / 2;
            gifData.y = cropData.y + (cropData.h - gifData.h) / 2;
        });

        document.getElementById('fit-1200-btn').addEventListener('click', () => {
            autoFit1200x134();
        });

        document.getElementById('export-btn').addEventListener('click', () => {
            if (parsedFrames.length === 0) return;

            showStatus('Dışa aktarılıyor...', false);

            const targetW = parseInt(document.getElementById('width-input').value) || 1200;
            const targetH = parseInt(document.getElementById('height-input').value) || 134;

            const text = document.getElementById('text-input').value;
            const textSize = document.getElementById('text-size').value;
            const textColor = document.getElementById('text-color').value;
            const textX = parseInt(document.getElementById('text-x').value) || 0;
            const textY = parseInt(document.getElementById('text-y').value) || 0;

            const format = document.getElementById('export-format').value;
            const step = parseInt(document.getElementById('frame-step').value) || 1;
            const quality = parseInt(document.getElementById('gif-quality').value) || 10;

            const scaleX = targetW / cropData.w;
            const scaleY = targetH / cropData.h;

            const renderGifX = (gifData.x - cropData.x) * scaleX;
            const renderGifY = (gifData.y - cropData.y) * scaleY;
            const renderGifW = gifData.w * scaleX;
            const renderGifH = gifData.h * scaleY;

            // Kare Atlama (Sampling) Uygula
            const sampledFrames = [];
            for (let i = 0; i < parsedFrames.length; i += step) {
                let accumulatedDelay = 0;
                for (let j = 0; j < step && (i + j) < parsedFrames.length; j++) {
                    accumulatedDelay += parsedFrames[i + j].delay;
                }
                sampledFrames.push({
                    canvas: parsedFrames[i].canvas,
                    delay: accumulatedDelay
                });
            }

            const processedCanvases = sampledFrames.map(frameObj => {
                const c = document.createElement('canvas');
                c.width = targetW;
                c.height = targetH;
                const cCtx = c.getContext('2d');

                cCtx.fillStyle = '#000000';
                cCtx.fillRect(0, 0, targetW, targetH);

                cCtx.save();
                cCtx.beginPath();
                cCtx.rect(0, 0, targetW, targetH);
                cCtx.clip();

                cCtx.drawImage(frameObj.canvas, renderGifX, renderGifY, renderGifW, renderGifH);

                if (text) {
                    cCtx.font = `${textSize}px Arial`;
                    cCtx.fillStyle = textColor;
                    cCtx.fillText(text, textX * scaleX, textY * scaleY);
                }
                cCtx.restore();

                return { canvas: c, delay: frameObj.delay };
            });

            if (format === 'gif') {
                const gifOptions = { workers: 2, quality: quality, width: targetW, height: targetH };
                if (workerBlobUrl) gifOptions.workerScript = workerBlobUrl;

                const gif = new GIF(gifOptions);
                processedCanvases.forEach(item => gif.addFrame(item.canvas, { delay: item.delay }));

                gif.on('finished', blob => {
                    downloadFile(blob, 'edited.gif');
                    hideStatus();
                });
                gif.render();

            } else if (format === 'apng') {
                try {
                    const imgs = [];
                    const delays = [];
                    processedCanvases.forEach(item => {
                        const imgData = item.canvas.getContext('2d').getImageData(0, 0, targetW, targetH).data.buffer;
                        imgs.push(imgData);
                        delays.push(item.delay);
                    });

                    const apngBuffer = UPNG.encode(imgs, targetW, targetH, 0, delays);
                    downloadFile(new Blob([apngBuffer], { type: 'image/png' }), 'edited.png');
                    hideStatus();
                } catch (err) {
                    showStatus('APNG Hatası: ' + err.message, true);
                }
            }
        });

        function downloadFile(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        function showStatus(text, isError) {
            statusBar.innerText = text;
            statusBar.style.display = 'block';
            statusBar.className = isError ? 'error' : '';
        }

        function hideStatus() {
            statusBar.style.display = 'none';
        }
    </script>
</body>
</html>
