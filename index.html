<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIF Düzenleyici</title>
    <script src="https://cdn.jsdelivr.net/npm/omggif@1.0.10/omggif.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/upng-js@2.1.0/UPNG.min.js"></script>
    <style>
        :root {
            --bg-color: #121214;
            --panel-bg: #1e1e24;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-color: #f3f4f6;
            --border-color: #374151;
            --error-color: #ef4444;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 320px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            user-select: none;
        }

        h2 {
            margin: 0 0 10px 0;
            font-size: 1.1rem;
            color: #fff;
        }

        .section {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-size: 0.8rem;
            color: #9ca3af;
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 8px;
            background: #111827;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: #fff;
            box-sizing: border-box;
            margin-bottom: 8px;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .row > div {
            flex: 1;
        }

        button, .file-upload-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
            transition: background 0.2s;
            display: block;
        }

        button:hover, .file-upload-btn:hover {
            background-color: var(--accent-hover);
        }

        input[type="file"] {
            display: none;
        }

        #editor-container {
            position: relative;
            display: inline-block;
            max-width: 100%;
            max-height: 80vh;
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        #drop-instructions {
            padding: 60px 40px;
            text-align: center;
            color: #6b7280;
        }

        canvas {
            display: block;
            max-width: 100%;
            max-height: 80vh;
        }

        /* İnteraktif Kırpma Kutusu */
        #crop-box {
            position: absolute;
            border: 2px dashed #6366f1;
            background: rgba(99, 102, 241, 0.15);
            box-sizing: border-box;
            cursor: move;
            display: none;
        }

        .handle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ffffff;
            border: 1px solid #6366f1;
            border-radius: 50%;
        }

        .handle.tl { top: -5px; left: -5px; cursor: nwse-resize; }
        .handle.tr { top: -5px; right: -5px; cursor: nesw-resize; }
        .handle.bl { bottom: -5px; left: -5px; cursor: nesw-resize; }
        .handle.br { bottom: -5px; right: -5px; cursor: nwse-resize; }

        #status-bar {
            position: absolute;
            bottom: 20px;
            background: rgba(0,0,0,0.9);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: none;
            z-index: 10;
        }

        #status-bar.error {
            border-color: var(--error-color);
            color: #fca5a5;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>GIF Düzenleyici</h2>
        
        <div class="section">
            <label for="file-input" class="file-upload-btn">GIF Seç</label>
            <input type="file" id="file-input" accept="image/gif">
        </div>

        <div class="section">
            <h2>Kırpma Ayarları</h2>
            <p style="font-size: 0.75rem; color: #9ca3af; margin-top: 0;">Görsel üzerindeki mavi kutuyu fare ile sürükleyip boyutlandırabilirsiniz.</p>
            <button id="reset-crop-btn" style="background: #374151; margin-bottom: 10px;">Kırpmayı Sıfırla</button>
            <div class="row">
                <div>
                    <label>Sol (X)</label>
                    <input type="number" id="crop-x" value="0">
                </div>
                <div>
                    <label>Üst (Y)</label>
                    <input type="number" id="crop-y" value="0">
                </div>
            </div>
            <div class="row">
                <div>
                    <label>Genişlik</label>
                    <input type="number" id="crop-w">
                </div>
                <div>
                    <label>Yükseklik</label>
                    <input type="number" id="crop-h">
                </div>
            </div>
        </div>

        <div class="section">
            <h2>Çıktı Boyutu</h2>
            <div class="row">
                <div>
                    <label>Genişlik (px)</label>
                    <input type="number" id="width-input">
                </div>
                <div>
                    <label>Yükseklik (px)</label>
                    <input type="number" id="height-input">
                </div>
            </div>
        </div>

        <div class="section">
            <h2>Yazı Ekle</h2>
            <label>Metin</label>
            <input type="text" id="text-input" placeholder="Yazı yazın...">
            <div class="row">
                <div>
                    <label>Boyut (px)</label>
                    <input type="number" id="text-size" value="28">
                </div>
                <div>
                    <label>Renk</label>
                    <input type="text" id="text-color" value="#ffffff">
                </div>
            </div>
            <div class="row">
                <div>
                    <label>Metin X</label>
                    <input type="number" id="text-x" value="20">
                </div>
                <div>
                    <label>Metin Y</label>
                    <input type="number" id="text-y" value="50">
                </div>
            </div>
        </div>

        <div class="section">
            <h2>Dışa Aktar</h2>
            <label>Format</label>
            <select id="export-format">
                <option value="gif">GIF</option>
                <option value="apng">APNG (Hareketli PNG)</option>
            </select>
            <button id="export-btn">İşle ve İndir</button>
        </div>
    </div>

    <div class="main-content">
        <div id="editor-container">
            <div id="drop-instructions">
                <p style="font-size: 1.2rem; margin-bottom: 5px;">GIF dosyasını buraya sürükleyin</p>
                <p style="font-size: 0.85rem;">veya sol panelden dosya seçin</p>
            </div>
            <canvas id="preview-canvas"></canvas>
            <div id="crop-box">
                <div class="handle tl"></div>
                <div class="handle tr"></div>
                <div class="handle bl"></div>
                <div class="handle br"></div>
            </div>
        </div>
        <div id="status-bar"></div>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const editorContainer = document.getElementById('editor-container');
        const dropInstructions = document.getElementById('drop-instructions');
        const previewCanvas = document.getElementById('preview-canvas');
        const cropBox = document.getElementById('crop-box');
        const ctx = previewCanvas.getContext('2d');
        const statusBar = document.getElementById('status-bar');

        let parsedFrames = [];
        let originalWidth = 0;
        let originalHeight = 0;
        let animationFrameId = null;
        let currentFrameIndex = 0;
        let workerBlobUrl = null;

        // Görsel üzerindeki kırpma parametreleri (Orijinal piksel ölçeğinde)
        let cropData = { x: 0, y: 0, w: 0, h: 0 };

        async function initWorker() {
            try {
                const res = await fetch('https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js');
                const text = await res.text();
                workerBlobUrl = URL.createObjectURL(new Blob([text], { type: 'application/javascript' }));
            } catch (err) {}
        }
        initWorker();

        // Drag & Drop
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => {
            editorContainer.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); });
            document.body.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); });
        });

        editorContainer.addEventListener('drop', e => {
            if (e.dataTransfer.files.length > 0) processGifFile(e.dataTransfer.files[0]);
        });

        fileInput.addEventListener('change', e => {
            if (e.target.files.length > 0) processGifFile(e.target.files[0]);
        });

        function processGifFile(file) {
            showStatus('GIF çözümleniyor...', false);
            const reader = new FileReader();

            reader.onload = function (e) {
                try {
                    const uint8Array = new Uint8Array(e.target.result);
                    const GifReaderClass = window.GifReader || (window.omggif && window.omggif.GifReader);
                    const gifReader = new GifReaderClass(uint8Array);

                    originalWidth = gifReader.width;
                    originalHeight = gifReader.height;

                    cropData = { x: 0, y: 0, w: originalWidth, h: originalHeight };
                    updateInputsFromCropData();

                    parsedFrames = [];
                    const numFrames = gifReader.numFrames();

                    const canvas = document.createElement('canvas');
                    canvas.width = originalWidth;
                    canvas.height = originalHeight;
                    const canvasCtx = canvas.getContext('2d');

                    for (let i = 0; i < numFrames; i++) {
                        const frameInfo = gifReader.frameInfo(i);
                        const imageData = canvasCtx.createImageData(originalWidth, originalHeight);

                        gifReader.decodeAndBlitFrameRGBA(i, imageData.data);

                        const frameCanvas = document.createElement('canvas');
                        frameCanvas.width = originalWidth;
                        frameCanvas.height = originalHeight;
                        const frameCtx = frameCanvas.getContext('2d');

                        if (i > 0 && frameInfo.disposal !== 2 && frameInfo.disposal !== 3) {
                            frameCtx.drawImage(parsedFrames[i - 1].canvas, 0, 0);
                        }

                        const tempCanvas = document.createElement('canvas');
                        tempCanvas.width = originalWidth;
                        tempCanvas.height = originalHeight;
                        tempCanvas.getContext('2d').putImageData(imageData, 0, 0);

                        frameCtx.drawImage(tempCanvas, 0, 0);

                        parsedFrames.push({
                            canvas: frameCanvas,
                            delay: (frameInfo.delay || 10) * 10
                        });
                    }

                    dropInstructions.style.display = 'none';
                    previewCanvas.style.display = 'block';
                    cropBox.style.display = 'block';

                    previewCanvas.width = originalWidth;
                    previewCanvas.height = originalHeight;

                    hideStatus();
                    syncCropBoxUI();
                    startPreview();

                } catch (err) {
                    showStatus('Hata: ' + err.message, true);
                }
            };

            reader.readAsArrayBuffer(file);
        }

        function startPreview() {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            let lastTime = performance.now();
            currentFrameIndex = 0;

            function render(now) {
                if (parsedFrames.length === 0) return;

                const currentFrame = parsedFrames[currentFrameIndex];
                const delay = currentFrame.delay > 0 ? currentFrame.delay : 100;

                if (now - lastTime >= delay) {
                    currentFrameIndex = (currentFrameIndex + 1) % parsedFrames.length;
                    lastTime = now;
                }

                ctx.clearRect(0, 0, originalWidth, originalHeight);
                ctx.drawImage(currentFrame.canvas, 0, 0);

                const text = document.getElementById('text-input').value;
                if (text) {
                    const textSize = document.getElementById('text-size').value;
                    const textColor = document.getElementById('text-color').value;
                    const textX = parseInt(document.getElementById('text-x').value) || 0;
                    const textY = parseInt(document.getElementById('text-y').value) || 0;

                    ctx.font = `${textSize}px Arial`;
                    ctx.fillStyle = textColor;
                    ctx.fillText(text, textX, textY);
                }

                animationFrameId = requestAnimationFrame(render);
            }

            animationFrameId = requestAnimationFrame(render);
        }

        // Kırpma Kutusunu Ekrana Senkronize Etme
        function getScaleRatio() {
            if (!previewCanvas.clientWidth) return 1;
            return previewCanvas.clientWidth / originalWidth;
        }

        function syncCropBoxUI() {
            const scale = getScaleRatio();
            cropBox.style.left = (cropData.x * scale) + 'px';
            cropBox.style.top = (cropData.y * scale) + 'px';
            cropBox.style.width = (cropData.w * scale) + 'px';
            cropBox.style.height = (cropData.h * scale) + 'px';
        }

        function updateInputsFromCropData() {
            document.getElementById('crop-x').value = Math.round(cropData.x);
            document.getElementById('crop-y').value = Math.round(cropData.y);
            document.getElementById('crop-w').value = Math.round(cropData.w);
            document.getElementById('crop-h').value = Math.round(cropData.h);
            document.getElementById('width-input').value = Math.round(cropData.w);
            document.getElementById('height-input').value = Math.round(cropData.h);
        }

        // İnteraktif Sürükle & Boyutlandır Mantığı
        let isDragging = false;
        let isResizing = false;
        let currentHandle = null;
        let startX, startY, startCropX, startCropY, startCropW, startCropH;

        cropBox.addEventListener('mousedown', e => {
            e.stopPropagation();
            const scale = getScaleRatio();
            startX = e.clientX;
            startY = e.clientY;

            if (e.target.classList.contains('handle')) {
                isResizing = true;
                currentHandle = e.target;
            } else {
                isDragging = true;
            }

            startCropX = cropData.x;
            startCropY = cropData.y;
            startCropW = cropData.w;
            startCropH = cropData.h;

            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        });

        function onMouseMove(e) {
            const scale = getScaleRatio();
            const dx = (e.clientX - startX) / scale;
            const dy = (e.clientY - startY) / scale;

            if (isDragging) {
                cropData.x = Math.max(0, Math.min(originalWidth - cropData.w, startCropX + dx));
                cropData.y = Math.max(0, Math.min(originalHeight - cropData.h, startCropY + dy));
            } else if (isResizing) {
                if (currentHandle.classList.contains('br')) {
                    cropData.w = Math.max(20, Math.min(originalWidth - startCropX, startCropW + dx));
                    cropData.h = Math.max(20, Math.min(originalHeight - startCropY, startCropH + dy));
                } else if (currentHandle.classList.contains('tl')) {
                    const newW = Math.max(20, startCropW - dx);
                    const newH = Math.max(20, startCropH - dy);
                    cropData.x = startCropX + (startCropW - newW);
                    cropData.y = startCropY + (startCropH - newH);
                    cropData.w = newW;
                    cropData.h = newH;
                } else if (currentHandle.classList.contains('tr')) {
                    const newH = Math.max(20, startCropH - dy);
                    cropData.w = Math.max(20, Math.min(originalWidth - startCropX, startCropW + dx));
                    cropData.y = startCropY + (startCropH - newH);
                    cropData.h = newH;
                } else if (currentHandle.classList.contains('bl')) {
                    const newW = Math.max(20, startCropW - dx);
                    cropData.x = startCropX + (startCropW - newW);
                    cropData.w = newW;
                    cropData.h = Math.max(20, Math.min(originalHeight - startCropY, startCropH + dy));
                }
            }

            syncCropBoxUI();
            updateInputsFromCropData();
        }

        function onMouseUp() {
            isDragging = false;
            isResizing = false;
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
        }

        // Input Değişikliklerini Kutucuğa Yansıtma
        ['crop-x', 'crop-y', 'crop-w', 'crop-h'].forEach(id => {
            document.getElementById(id).addEventListener('input', () => {
                cropData.x = parseInt(document.getElementById('crop-x').value) || 0;
                cropData.y = parseInt(document.getElementById('crop-y').value) || 0;
                cropData.w = parseInt(document.getElementById('crop-w').value) || originalWidth;
                cropData.h = parseInt(document.getElementById('crop-h').value) || originalHeight;
                syncCropBoxUI();
            });
        });

        document.getElementById('reset-crop-btn').addEventListener('click', () => {
            cropData = { x: 0, y: 0, w: originalWidth, h: originalHeight };
            updateInputsFromCropData();
            syncCropBoxUI();
        });

        // Dışa Aktarma
        document.getElementById('export-btn').addEventListener('click', () => {
            if (parsedFrames.length === 0) return;

            showStatus('Dışa aktarılıyor...', false);

            const targetW = parseInt(document.getElementById('width-input').value) || cropData.w;
            const targetH = parseInt(document.getElementById('height-input').value) || cropData.h;

            const text = document.getElementById('text-input').value;
            const textSize = document.getElementById('text-size').value;
            const textColor = document.getElementById('text-color').value;
            const textX = parseInt(document.getElementById('text-x').value) || 0;
            const textY = parseInt(document.getElementById('text-y').value) || 0;

            const format = document.getElementById('export-format').value;

            const processedCanvases = parsedFrames.map(frameObj => {
                const c = document.createElement('canvas');
                c.width = targetW;
                c.height = targetH;
                const cCtx = c.getContext('2d');

                // Kırpılan alanı alıp hedef boyuta aktarma
                cCtx.drawImage(
                    frameObj.canvas,
                    cropData.x, cropData.y, cropData.w, cropData.h,
                    0, 0, targetW, targetH
                );

                if (text) {
                    cCtx.font = `${textSize}px Arial`;
                    cCtx.fillStyle = textColor;
                    cCtx.fillText(text, textX, textY);
                }
                return { canvas: c, delay: frameObj.delay };
            });

            if (format === 'gif') {
                const gifOptions = { workers: 2, quality: 10, width: targetW, height: targetH };
                if (workerBlobUrl) gifOptions.workerScript = workerBlobUrl;

                const gif = new GIF(gifOptions);
                processedCanvases.forEach(item => gif.addFrame(item.canvas, { delay: item.delay }));

                gif.on('finished', blob => {
                    downloadFile(blob, 'edited.gif');
                    hideStatus();
                });
                gif.render();

            } else if (format === 'apng') {
                const imgs = [];
                const delays = [];
                processedCanvases.forEach(item => {
                    imgs.push(item.canvas.getContext('2d').getImageData(0, 0, targetW, targetH).data.buffer);
                    delays.push(item.delay);
                });

                const apngBuffer = UPNG.encode(imgs, targetW, targetH, 0, delays);
                downloadFile(new Blob([apngBuffer], { type: 'image/png' }), 'edited.png');
                hideStatus();
            }
        });

        function downloadFile(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        function showStatus(text, isError) {
            statusBar.innerText = text;
            statusBar.style.display = 'block';
            statusBar.className = isError ? 'error' : '';
        }

        function hideStatus() {
            statusBar.style.display = 'none';
        }

        window.addEventListener('resize', syncCropBoxUI);
    </script>
</body>
</html>
